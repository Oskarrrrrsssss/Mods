plugins {
    id 'fabric-loom' version "${loom_version}"
}
version = project.mod_version
group = 'dev.invumusicplayer'
base { archivesName = 'invumusicplayer' }
repositories { mavenCentral() }
loom {
    splitEnvironmentSourceSets()
    mods { invumusicplayer { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // PCM output uses JavaSound. Bundle the MP3 and Vorbis SPI providers and their dependencies.
    for (artifact in [
        'com.tianscar.javasound:javasound-mp3:1.9.8',
        'com.tianscar.javasound:javasound-vorbis:2.1.0',
        'com.googlecode.soundlibs:tritonus-share:0.3.7.4',
        'net.java.dev.jna:jna:5.18.1',
        'net.java.dev.jna:jna-platform:5.18.1',
        'com.twelvemonkeys.imageio:imageio-webp:3.12.0', 'com.twelvemonkeys.imageio:imageio-core:3.12.0',
        'com.twelvemonkeys.imageio:imageio-metadata:3.12.0', 'com.twelvemonkeys.common:common-lang:3.12.0',
        'com.twelvemonkeys.common:common-io:3.12.0', 'com.twelvemonkeys.common:common-image:3.12.0'
    ]) { implementation artifact; include artifact }
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.register('buildNativeSpotify', Exec) {
    inputs.dir('native-spotify/src'); inputs.file('native-spotify/Cargo.toml'); inputs.file('native-spotify/Cargo.lock')
    outputs.file('native-spotify/target/release/invumusicplayer-spotify' + (System.getProperty('os.name').startsWith('Windows') ? '.exe' : ''))
    commandLine 'cargo', 'build', '--release', '--locked', '--manifest-path', 'native-spotify/Cargo.toml'
}
tasks.register('stageNativeSpotify', Exec) {
    dependsOn 'buildNativeSpotify'
    commandLine 'python', 'scripts/package-spotify-native.py'
}
processResources {
    dependsOn 'stageNativeSpotify'
    from('build/generated/spotify-native') { into 'spotify-native' }
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
java { toolchain { languageVersion = JavaLanguageVersion.of(17) }; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
test { useJUnitPlatform(); systemProperty 'invu.spotify.native.check', 'true'; systemProperty 'invu.spotify.oauth.check', 'true' }
tasks.register('verifyYouTubeTools', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.invumusicplayer.core.YouTubeTools'
    args file('build/youtube-tools-smoke').absolutePath
}
jar { from('LICENSE'); from('native-spotify/licenses') { into 'META-INF/licenses/spotify' } }


tasks.register('inspectClientApi', Exec) {
 doFirst { commandLine 'javap','-protected','-classpath',sourceSets.client.compileClasspath.asPath,
 'net.minecraft.client.Minecraft','net.minecraft.client.gui.GuiGraphics','net.minecraft.client.gui.screens.Screen',
 'net.minecraft.client.gui.components.AbstractSliderButton','net.minecraft.client.gui.components.EditBox',
 'net.minecraft.client.gui.components.Button','net.minecraft.client.Screenshot','net.minecraft.client.gui.screens.worldselection.CreateWorldScreen',
 'net.minecraft.client.gui.screens.worldselection.WorldOpenFlows','net.fabricmc.fabric.api.client.screen.v1.ScreenEvents' }
}
sourceSets { smoketest { compileClasspath = sourceSets.client.compileClasspath + sourceSets.main.output + sourceSets.client.output; runtimeClasspath = output + sourceSets.client.runtimeClasspath + sourceSets.main.output + sourceSets.client.output } }
configurations { smoketestImplementation.extendsFrom implementation; smoketestRuntimeOnly.extendsFrom runtimeOnly }
loom {
 mods { 'invumusicplayer-smoke' { sourceSet sourceSets.smoketest } }
 runs { smoke { client(); name 'InvuMusicPlayer 1.20.4 smoke'; source sourceSets.smoketest; runDir 'build/run/smoke'; vmArg '-Dinvu.smoke=true' } }
}
tasks.register('smoketestJar',Jar) { from sourceSets.smoketest.output; archiveClassifier='smoketest' }



loom.runs.smoke.vmArg('-Dinvu.referenceCover=' + file('build/reference-cover.jpg').absolutePath)

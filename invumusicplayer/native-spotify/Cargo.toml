[package]
name = "invumusicplayer-spotify"
version = "0.2.8"
edition = "2024"
license = "MIT"

[dependencies]
librespot-core = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e078d512456fb008aaa9ba6246881bd9", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-playback = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e078d512456fb008aaa9ba6246881bd9", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-protocol = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e078d512456fb008aaa9ba6246881bd9", default-features = false }
base64 = "0.22"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time"] }

[profile.release]
strip = true
lto = "thin"
